<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111c">
  <title>WAP — Painel de Vagas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">W</span><div><strong>WAP</strong><small>PAINEL DE VAGAS</small></div></div>
    <nav>
      <button class="nav-item active" data-view="dashboard">▣ Dashboard</button>
      <button class="nav-item" data-status-view="">▦ Todas as vagas</button>
      <button class="nav-item" data-status-view="Para candidatar">➤ Para candidatar</button>
      <button class="nav-item" data-status-view="Candidatado">✓ Candidatadas</button>
      <button class="nav-item" data-status-view="Entrevista">● Entrevistas</button>
    </nav>
    <div class="sidebar-footer"><span id="sessionStatus">Conectando...</span><button id="refreshBtn">↻ Atualizar</button></div>
  </aside>

  <main class="main">
    <header class="topbar"><div><div class="eyebrow">MOTOR PROFISSIONAL</div><h1>Vagas de emprego</h1></div><button id="newJobBtn" class="primary">+ Nova vaga</button></header>

    <section class="metrics">
      <article><small>Total</small><strong id="mTotal">0</strong></article>
      <article><small>Para candidatar</small><strong id="mApply">0</strong></article>
      <article><small>Candidatadas</small><strong id="mApplied">0</strong></article>
      <article><small>Entrevistas</small><strong id="mInterview">0</strong></article>
      <article><small>Média compat.</small><strong id="mAvg">0%</strong></article>
    </section>

    <section class="filters">
      <input id="search" placeholder="Buscar empresa, cargo ou tecnologia...">
      <select id="statusFilter"><option value="">Todos os status</option><option>Para candidatar</option><option>Candidatado</option><option>Entrevista</option><option>Descartada</option><option>Contratado</option></select>
      <select id="priorityFilter"><option value="">Todas as prioridades</option><option>Alta</option><option>Media</option><option>Baixa</option></select>
      <select id="channelFilter"><option value="">Todos os canais</option><option>LinkedIn</option><option>Gupy</option><option>Indeed</option><option>InfoJobs</option><option>Outro</option></select>
    </section>

    <section id="jobs" class="jobs"><div class="loading">Carregando vagas...</div></section>
  </main>

  <dialog id="jobDialog">
    <form id="jobForm" method="dialog">
      <header><h2>Nova vaga</h2><button type="button" id="closeDialog">×</button></header>
      <div class="form-grid">
        <label>Empresa<input name="empresa" required></label>
        <label>Cargo<input name="cargo" required></label>
        <label>Tecnologias<input name="tecnologias" placeholder="PHP, JavaScript, MySQL"></label>
        <label>Modalidade<input name="modalidade" value="Remoto"></label>
        <label>Localização<input name="localizacao" value="Brasil"></label>
        <label>Salário<input name="salario"></label>
        <label>Fonte<input name="fonte" value="LinkedIn"></label>
        <label>Link da vaga<input name="link_vaga" type="url"></label>
        <label>Compatibilidade<input name="compatibilidade" type="number" min="0" max="100" value="80"></label>
        <label>Prioridade<select name="prioridade"><option>Alta</option><option selected>Media</option><option>Baixa</option></select></label>
        <label class="full">Descrição<textarea name="descricao"></textarea></label>
        <label class="full">Observações<textarea name="observacoes"></textarea></label>
      </div>
      <p id="formMessage"></p>
      <footer><button type="button" id="cancelDialog">Cancelar</button><button class="primary" type="submit">Salvar vaga</button></footer>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config-jobs.js"></script>
  <script src="jobs.js"></script>
</body>
</html>
